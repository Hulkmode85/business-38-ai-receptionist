<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReceptionistAI — AI Voice Agent for Your Business</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Segoe UI',system-ui,sans-serif;background:#0a0a0f;color:#e0e0e0;min-height:100vh}
        .header{background:linear-gradient(135deg,#0a0a1f,#0f0a1f);border-bottom:1px solid #1e1a2e;padding:20px 40px;display:flex;justify-content:space-between;align-items:center}
        .logo{font-size:24px;font-weight:700;color:#a78bfa}.logo span{color:#8b5cf6}
        nav a{color:#9ca3af;text-decoration:none;margin-left:24px;font-size:14px;transition:color .2s}nav a:hover{color:#a78bfa}
        .container{max-width:900px;margin:40px auto;padding:0 20px}
        h1{font-size:32px;text-align:center;margin-bottom:8px;background:linear-gradient(to right,#a78bfa,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .subtitle{text-align:center;color:#9ca3af;margin-bottom:32px;font-size:15px}
        .form-card{background:#111118;border:1px solid #1e1e2e;border-radius:16px;padding:32px}
        .form-group{margin-bottom:16px}
        .form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
        label{display:block;font-size:13px;color:#9ca3af;margin-bottom:6px;font-weight:500}
        input,select,textarea{width:100%;padding:12px 16px;background:#0a0a14;border:1px solid #2a2a3e;border-radius:10px;color:#e0e0e0;font-size:14px;outline:none;transition:border-color .2s}
        input:focus,select:focus,textarea:focus{border-color:#8b5cf6}
        textarea{resize:vertical;min-height:80px}
        .examples{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
        .examples button{background:#1e1e2e;border:1px solid #2a2a3e;color:#9ca3af;padding:6px 12px;border-radius:8px;font-size:12px;cursor:pointer;transition:all .2s}
        .examples button:hover{border-color:#8b5cf6;color:#a78bfa}
        .btn{width:100%;padding:14px;background:linear-gradient(135deg,#8b5cf6,#a78bfa);color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;transition:opacity .2s;margin-top:8px}
        .btn:hover{opacity:.9}.btn:disabled{opacity:.5;cursor:not-allowed}
        .output{margin-top:24px;background:#111118;border:1px solid #1e1e2e;border-radius:16px;padding:32px;display:none}
        .output h2{font-size:20px;color:#a78bfa;margin-bottom:16px}
        .output pre{white-space:pre-wrap;font-family:'Cascadia Code','Fira Code',monospace;line-height:1.7;font-size:14px;color:#d0d0d0}
        .copy-btn{background:#1e1e2e;color:#a78bfa;border:1px solid #2a2a3e;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:13px;margin-top:12px}.copy-btn:hover{background:#2a2a3e}
        .spinner{display:inline-block;width:18px;height:18px;border:2px solid #fff3;border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:8px}
        @keyframes spin{to{transform:rotate(360deg)}}
        .error{color:#f87171;margin-top:12px;font-size:14px}
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">Receptionist<span>AI</span></div>
        <nav><a href="/docs">Pricing</a><a href="/docs">API</a></nav>
    </div>
    <div class="container">
        <h1>AI Receptionist That Never Misses a Call</h1>
        <p class="subtitle">Simulate how an AI receptionist handles calls for your business. Test it live.</p>
        <div class="form-card">
            <div class="form-row">
                <div class="form-group">
                    <label>Business Type</label>
                    <select id="business_type">
                        <option value="dental clinic">Dental Clinic</option>
                        <option value="law firm">Law Firm</option>
                        <option value="real estate agency">Real Estate Agency</option>
                        <option value="medical practice">Medical Practice</option>
                        <option value="auto repair shop">Auto Repair Shop</option>
                        <option value="salon and spa">Salon & Spa</option>
                        <option value="accounting firm">Accounting Firm</option>
                        <option value="veterinary clinic">Veterinary Clinic</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Tone</label>
                    <select id="tone">
                        <option value="professional and friendly">Professional & Friendly</option>
                        <option value="warm and casual">Warm & Casual</option>
                        <option value="formal and authoritative">Formal & Authoritative</option>
                        <option value="upbeat and energetic">Upbeat & Energetic</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label>Services your business offers (optional)</label>
                <input type="text" id="services" placeholder="e.g., teeth cleaning, fillings, cosmetic dentistry, emergency care">
            </div>
            <div class="form-group">
                <label>What does the caller say?</label>
                <textarea id="caller_message" placeholder="e.g., Hi, I'd like to schedule a cleaning for next week. Do you have any openings on Tuesday?"></textarea>
            </div>
            <div class="examples">
                <button onclick="setExample('I need to book an appointment for next Thursday')">Book appointment</button>
                <button onclick="setExample('What are your hours on weekends?')">Ask hours</button>
                <button onclick="setExample('I need to cancel my appointment tomorrow')">Cancel appt</button>
                <button onclick="setExample('How much does a consultation cost?')">Ask pricing</button>
                <button onclick="setExample('I have an emergency, can someone see me today?')">Emergency</button>
                <button onclick="setExample('Can I speak to the manager about a billing issue?')">Transfer</button>
            </div>
            <button class="btn" id="genBtn" onclick="generate()">Simulate Call</button>
            <div class="error" id="error"></div>
        </div>
        <div class="output" id="output">
            <h2>AI Receptionist Response</h2>
            <pre id="result"></pre>
            <button class="copy-btn" onclick="copyResult()">Copy to Clipboard</button>
        </div>
    </div>
    <script>
        function setExample(text){document.getElementById('caller_message').value=text}
        async function generate(){
            const btn=document.getElementById('genBtn');
            const msg=document.getElementById('caller_message').value.trim();
            if(!msg){document.getElementById('error').textContent='Please enter what the caller says.';return}
            document.getElementById('error').textContent='';
            btn.disabled=true;btn.innerHTML='<span class="spinner"></span>Processing call...';
            document.getElementById('output').style.display='none';
            try{
                const r=await fetch('/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({business_type:document.getElementById('business_type').value,caller_message:msg,tone:document.getElementById('tone').value,services:document.getElementById('services').value})});
                const d=await r.json();
                if(d.error)throw new Error(d.error);
                document.getElementById('result').textContent=d.result;
                document.getElementById('output').style.display='block';
            }catch(e){document.getElementById('error').textContent='Error: '+e.message}
            finally{btn.disabled=false;btn.textContent='Simulate Call'}
        }
        function copyResult(){navigator.clipboard.writeText(document.getElementById('result').textContent);const b=event.target;b.textContent='Copied!';setTimeout(()=>b.textContent='Copy to Clipboard',2000)}
    </script>
</body>
</html>
